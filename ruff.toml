# Ruff 配置 —— 遵循 AstrBot 插件开发原则「提交前使用 ruff 格式化代码」
target-version = "py310"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # 行长由 formatter 控制
    "B008", # AstrBot 装饰器模式需要函数调用作为默认值
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
